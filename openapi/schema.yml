  /api/organizations/{id}/:
    get:
      operationId: organizations_retrieve
      description: "GET /api/organizations/{id}/ \u2014 one academy, for its members\
        \ only.\n\nKnowing the id is not access. A non-member and a suspended member\
        \ both get\n403, and the object is fetched through the caller's own membership\
        \ rather than\nfrom ``Organization.objects``, so there is no queryset here\
        \ that could return a\ntenant the caller does not belong to.\n\nEvery active\
        \ role may read the academy \u2014 owner, admin, staff and teacher. It is\n\
        the organization's own name, slug and timezone; the things worth protecting\n\
        inside a tenant are its members and, in later phases, its students, schedules\n\
        and money."
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - organizations
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
        '401':
          description: Not authenticated.
        '403':
          description: Not an active member of this organization.
  /api/organizations/mine/:
    get:
      operationId: organizations_mine_list
      description: "GET /api/organizations/mine/ \u2014 the academies the caller belongs\
        \ to.\n\nOne entry per active membership, each carrying the organization,\
        \ the caller's\nrole in it and the membership's status \u2014 enough for a\
        \ client to know where the\nuser can act and as what. A user in two academies\
        \ sees two entries.\n\nSuspended memberships are absent, which is the same\
        \ rule every other endpoint\nhere applies: an active membership is what grants\
        \ tenant access, and a\nsuspended member reading the academy's name and timezone\
        \ through this listing\nwould be the one hole in it. Telling a suspended member\
        \ *why* they lost access\nis a product decision for the onboarding phase (see\
        \ learnings.md)."
      tags:
      - organizations
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyOrganizationMembership'
          description: ''
        '401':
          description: Not authenticated.
  /api/payouts/organizations/{organization_pk}/{id}/finalize/:
    post:
      operationId: payouts_organizations_finalize_create
      description: "POST /api/payouts/organizations/<organization_pk>/<int:pk>/finalize/\
        \ \u2014 make one payout history.\n\nOwner/admin-only, and one-way: after\
        \ this the record refuses every write, including\nthe lead's own. A payout\
        \ that is already finalized answers 409 rather than\nsilently succeeding,\
        \ because a second finalization means the caller is acting\non a stale copy\
        \ of a financial record."
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - payouts
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherPayout'
          description: Finalized. The record is now immutable.
        '403':
          description: Not an organization owner or administrator.
        '404':
          description: No such payout.
        '409':
          description: Already finalized.
  /api/payouts/organizations/{organization_pk}/generate/:
    post:
      operationId: payouts_organizations_generate_create
      description: "POST /api/payouts/organizations/<organization_pk>/generate/ \u2014\
        \ turn a period's completed sessions into payouts.\n\nSafe to repeat, which\
        \ is the property that makes it usable: a lead who is not\nsure whether the\
        \ run went through can simply run it again, and the second run\ncreates nothing.\
        \ Existing records are never recalculated, so a rate raised\nyesterday does\
        \ not reprice last month's payroll.\n\nThe response reports both halves of\
        \ the run. ``skipped`` is not noise: a\nsub-teacher's session skipped for\
        \ ``no_payout_rate`` is the lead's cue to set\na rate, and a group-class seat\
        \ skipped for ``cohort_session_already_paid``\nexplains why a busy session\
        \ produced one record."
      parameters:
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - payouts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutGenerate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PayoutGenerate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PayoutGenerate'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationResult'
          description: Records created, plus every booking that was skipped and why.
            A repeat run answers 201 with created_count 0.
        '400':
          description: Bad period, or an unknown teacher.
        '403':
          description: Not an organization owner or administrator.
  /api/payouts/organizations/{organization_pk}/lead/:
    get:
      operationId: payouts_organizations_lead_list
      description: "GET /api/payouts/organizations/<organization_pk>/lead/ \u2014\
        \ academy-wide payout records.\n\nFilterable by ``?teacher_id=`` and by period.\
        \ Unfiltered it is every payout\nrecord in the academy, which is the owner/admin's\
        \ to see and nobody else's:\nthe permission class is the only thing standing\
        \ between this queryset and a\nsub-teacher reading their colleagues' income,\
        \ which is why it is the *first*\nthing the class declares."
