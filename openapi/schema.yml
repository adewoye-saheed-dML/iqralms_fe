      description: "A person in a waitlist row \u2014 no signup_code, no sprawl, same\
        \ as bookings."
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        timezone:
          type: string
          readOnly: true
          description: IANA zone name, e.g. 'Africa/Lagos'. Required at signup.
      required:
      - first_name
      - id
      - last_name
      - role
      - timezone
      - username
    WaitlistPromote:
      type: object
      description: "The lead promotes an entry into a session.\n\nThe slot is optional:\
        \ it defaults to the one the family asked for, and\noverrides only *when*\
        \ the session runs \u2014 the entry always keeps its original\nrequest on\
        \ record. ``duration_minutes`` defaults the same way."
      properties:
        start_time_utc:
          type: string
          format: date-time
        duration_minutes:
          type: integer
          minimum: 1
        teacher_id:
          type: integer
    AvailabilityCreate:
      type: object
      description: Payload to declare a weekly teaching availability window.
      properties:
        weekday:
          type: integer
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
