  /api/curriculum/placements/{id}/audio/:
    get:
      operationId: curriculum_placements_audio_retrieve
      description: "GET /api/curriculum/placements/{id}/audio/?token=... \u2014 the\
        \ local path.\n\nOnly used when the storage backend cannot sign its own URLs,\
        \ i.e. local\nprivate storage in development and tests. Against a private\
        \ bucket the\nminted URL is presigned and points at the bucket, so nothing\
        \ reaches here.\n\n**Deliberately not organization-scoped, and that is not\
        \ a hole.** The token is\na bearer capability standing in for a presigned\
        \ URL, minted only after\n``AcademyPlacementAudioURLView`` has checked the\
        \ caller's membership, the\nplacement's academy and the Phase 6 role rule.\
        \ Requiring a tenant in the path\nhere would add a check that proves nothing\
        \ \u2014 the holder of the token is\nauthorised by having been given it \u2014\
        \ while an ``<audio src>`` element cannot\nsend an Authorization header, which\
        \ is exactly why presigned URLs exist.\n\nWhat it does check, on every request:\n\
        \n* the token's signature and its age (``read_audio_token``);\n* that the\
        \ token names *this* placement \u2014 a token for one sample cannot be\n \
        \ pointed at another by editing the path;\n* that the placement still holds\
        \ the object the token was minted for, so a\n  re-submitted sample invalidates\
        \ outstanding tokens immediately rather than\n  at expiry.\n\nEvery failure\
        \ is the same 404. Telling the caller which check failed would\nlet someone\
        \ probing tokens narrow down why."
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: token
        schema:
          type: string
        description: The signed token from the audio-url endpoint.
        required: true
      tags:
      - curriculum
      security:
      - {}
      responses:
        '200':
          description: The audio file itself.
        '404':
          description: Missing, invalid, expired or superseded token.
  /api/imports/organizations/{organization_pk}/{id}/commit/:
    post:
      operationId: imports_commit
      description: "Resolves the URL's organization to the caller's own membership,\
        \ once.\n\nThe permission classes and the querysets both need the same answer\
        \ to \"is this\ncaller inside this tenant, and as what\", and asking twice\
        \ is how the two\neventually disagree. So it is resolved here, cached for\
        \ the request, and read\nfrom ``view.caller_membership`` by everything else.\n\
        \n``None`` means no access \u2014 non-member, suspended member and anonymous\
        \ caller\nalike \u2014 and the permission layer turns that into a refusal\
        \ before any handler\nruns. Which is why ``organization`` may assume it is\
        \ not None: by the time a\nhandler executes, the caller has an active membership\
        \ in this organization."
      summary: Commit a validated import job
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - imports
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJobResponse'
          description: ''
