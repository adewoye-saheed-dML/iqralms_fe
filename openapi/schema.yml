  /api/organizations/:
    post:
      operationId: organizations_create
      description: "POST /api/organizations/ \u2014 any authenticated user may found\
        \ an academy.\n\nThe creator becomes the organization's single ``owner`` in\
        \ the same\ntransaction, which the serializer guarantees; there is no request\
        \ in which one\nhappens without the other. Their ``accounts`` role is left\
        \ exactly as it was:\na student who founds an academy owns it and is still\
        \ a student.\n\nNo permission class beyond authentication. Who may create\
        \ a tenant is a\nsignup/billing question, and Phase 1 has neither \u2014 restricting\
        \ it now would be\ninventing a product rule the spec explicitly leaves to\
        \ later phases."
