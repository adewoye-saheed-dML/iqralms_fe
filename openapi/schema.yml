    TeacherAssessment:
      type: object
      description: "The assessing teacher's view of their own submission.\n\nCarries\
        \ their own flag and its reason \u2014 they wrote both \u2014 and\n``lead_reviewed_at``\
        \ so they can see the lead has looked. It does **not**\ncarry ``lead_review_note``\
        \ or ``lead_reviewed_by``: the spec's visibility\nsection gives a sub-teacher\
        \ no access to lead review notes in this phase, and\nwidening that is a decision,\
        \ not a serializer tweak."
      properties:
        id:
          type: integer
          readOnly: true
        booking:
          allOf:
          - $ref: '#/components/schemas/AssessmentBooking'
          readOnly: true
        student:
          allOf:
          - $ref: '#/components/schemas/AssessmentParty'
          readOnly: true
        track:
          type: string
          description: Unique within the owning academy, not across the platform.
          readOnly: true
        assessed_at:
          type: string
          format: date-time
          readOnly: true
          description: When it was submitted. Stored UTC, rendered per-viewer.
        assessed_at_local:
          type: string
          nullable: true
          readOnly: true
        rubric_name:
          type: string
          readOnly: true
          description: Snapshot of the rubric's name at submission time.
        criteria_snapshot:
          readOnly: true
          description: 'Snapshot of the criteria scored: [{id, name, order}]. What
            the teacher was actually looking at, frozen.'
        scores:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentScore'
          readOnly: true
        overall_average:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
          readOnly: true
        teacher_summary:
          type: string
          readOnly: true
          description: 'Written for the family: this is the one free-text field they
            read.'
        flagged_for_review:
          type: boolean
          readOnly: true
          description: The teacher asking the lead to look at this session.
        flag_reason:
          type: string
          readOnly: true
          description: "Why it was flagged. Internal \u2014 never shown to a student\
            \ or parent."
        lead_reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Set by an explicit lead action. Viewing an assessment does
            not set it.
      required:
      - assessed_at
      - assessed_at_local
      - booking
      - criteria_snapshot
      - flag_reason
      - flagged_for_review
      - id
      - lead_reviewed_at
      - overall_average
      - rubric_name
      - scores
      - student
      - teacher_summary
      - track
    TeacherPayout:
      type: object
      description: 'The lead''s view: the same record, plus whose it is.'
      properties:
        id:
          type: integer
          readOnly: true
        teacher:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          readOnly: true
        booking:
          allOf:
          - $ref: '#/components/schemas/PayoutSession'
          readOnly: true
        cohort:
          type: integer
          readOnly: true
          nullable: true
          description: Set when the paid session is a group class, so the unique constraint
            below can enforce one payout per cohort session. Always equal to booking.cohort.
        minutes_paid:
          type: integer
          readOnly: true
          description: Session length used in the calculation, snapshotted from the
            booking. Stored rather than derived so the record explains its own amount
            without depending on a row that could later be corrected.
        rate_used:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          readOnly: true
          description: 'The teacher''s hourly rate at generation time, snapshotted
            the same way PricingAgreement.standard_rate is: changing the live rate
            must not reprice a payout that has already been made.'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          description: "minutes_paid / 60 \xD7 rate_used, rounded once. See payout_amount()."
        currency:
          type: string
          readOnly: true
          description: ISO code, snapshotted. NGN today; conversion is out of scope.
        status:
          allOf:
          - $ref: '#/components/schemas/PayoutStatusEnum'
          readOnly: true
          description: "generated \u2192 finalized. Finalized records are immutable.\n\
            \n* `generated` - Generated\n* `finalized` - Finalized"
        status_display:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        finalized_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Stamped when the lead finalizes. Null while generated.
      required:
      - amount
      - booking
      - cohort
      - created_at
      - currency
      - finalized_at
      - id
      - minutes_paid
      - rate_used
      - status
      - status_display
      - teacher
    TeacherProfile:
      type: object
      description: Read-only in this phase; profiles are created via the admin.
      properties:
        bio:
          type: string
          readOnly: true
        max_weekly_hours:
          type: integer
          readOnly: true
          description: Capacity dial used by scheduling in a later phase.
        hourly_payout_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          description: Null for the lead teacher, who is not paid a per-hour rate.
        is_lead:
          type: boolean
          readOnly: true
        approved:
          type: boolean
          readOnly: true
          description: A sub-teacher is not bookable until a lead flips this true.
      required:
      - approved
      - bio
      - hourly_payout_rate
      - is_lead
      - max_weekly_hours
    TeacherReport:
      type: object
      description: 'One teacher''s row in the lead''s quality report.


        Deliberately not sortable by score and deliberately without a rank field.
        The

        rows arrive ordered by username; a client that wants a league table has to

        build one itself, and the phase spec says not to.'
      properties:
        teacher:
          allOf:
          - $ref: '#/components/schemas/AssessmentParty'
          readOnly: true
        assessed_sessions:
          type: integer
          readOnly: true
        overall_average:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        by_track:
          type: array
          items:
            $ref: '#/components/schemas/TeacherTrackReport'
          readOnly: true
        flagged:
          type: integer
          readOnly: true
        awaiting_lead_review:
          type: integer
          readOnly: true
      required:
      - assessed_sessions
      - awaiting_lead_review
      - by_track
      - flagged
      - overall_average
      - teacher
    TeacherTrack:
      type: object
      description: 'One teacher''s eligibility for one track, inside one academy.


        ``user`` and ``organization`` are read off the membership rather than stored

        twice, which is the same shape ``accounts.OrganizationTeacherConfiguration``

        exposes and for the same reason: the membership is the only place the pair
        is

        written. ``username`` because an id does not identify a person to the human

        deciding what they may teach.'
      properties:
        id:
          type: integer
          readOnly: true
        membership:
          type: integer
          readOnly: true
          description: The academy-and-teacher relationship this eligibility is for.
        user:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        organization:
          type: integer
          readOnly: true
        track:
          type: integer
          readOnly: true
          description: A track owned by the same academy as the membership.
        track_slug:
          type: string
          readOnly: true
        active:
          type: boolean
          readOnly: true
          description: Whether the teacher may currently be assigned this track here.
            Withdrawing eligibility keeps the row, the way a suspended membership
            does, so the record of what was once granted survives.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - active
      - created_at
      - id
      - membership
      - organization
      - track
      - track_slug
      - updated_at
      - user
      - username
    TeacherTrackCreate:
      type: object
      description: "Giving one of this academy's teachers a track to teach.\n\nThe\
        \ caller names a ``user``, not a membership \u2014 the shape\n``accounts.OrganizationTeacherConfigurationCreateSerializer``\
        \ established, and\nfor the same reason: the membership is then looked up\
        \ *inside* the view's\nverified organization, so a membership belonging to\
        \ another academy is not\nsomething a request can express. An academy administrator\
        \ therefore cannot\nreach a teacher's eligibility in a different academy even\
        \ when they know both\nids, which is the phase spec's cross-academy teacher\
        \ requirement.\n\n``track`` is narrowed to this academy for the same reason."
      properties:
        user:
          type: integer
        track:
          type: integer
        active:
          type: boolean
          default: true
      required:
      - track
      - user
    TeacherTrackReport:
      type: object
      properties:
        track:
          allOf:
          - $ref: '#/components/schemas/TrackBrief'
          readOnly: true
        assessed_sessions:
          type: integer
          readOnly: true
        overall_average:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
      required:
      - assessed_sessions
      - overall_average
      - track
    TimeWindow:
      type: object
      description: "The slot a requested session would occupy: when it starts, how\
        \ long it runs.\n\nThe Phase 4 spec names the field ``requested_time_window``\
        \ without defining\nits shape. This is the exact-slot reading (product owner's\
        \ call, 2026-08-24):\nrouting decides *who* teaches, never *when*, so a student\
        \ is never quietly\nmoved to a different time than the one they asked for.\
        \ The single exception is\na cohort, whose own ``schedule_start_utc`` wins\
        \ within\n``COHORT_START_TOLERANCE`` \u2014 and the response says so, in ``routed_reason``."
      properties:
        start_time_utc:
          type: string
          format: date-time
        duration_minutes:
          type: integer
          minimum: 1
          default: 30
      required:
      - start_time_utc
    Token:
      type: object
      description: Serializer for Token model.
      properties:
        key:
          type: string
          maxLength: 40
      required:
      - key
    Track:
      type: object
      description: "One academy's track, with its levels nested in order.\n\n``organization``\
        \ travels in the body even though it is already in the URL. The\nfuture frontend\
        \ holds tracks from several academies in one client \u2014 a teacher\nworking\
        \ for two of them \u2014 and a track that does not say whose it is has to\
        \ be\nremembered rather than read."
      properties:
        id:
          type: integer
          readOnly: true
        organization:
          type: integer
          readOnly: true
          description: The academy that owns this track, and through it the track's
            levels and placements. Set at creation; not editable afterwards.
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          description: Unique within the owning academy, not across the platform.
          pattern: ^[-a-zA-Z0-9_]+$
        levels:
          type: array
          items:
            $ref: '#/components/schemas/Level'
          readOnly: true
      required:
      - id
      - levels
      - name
      - organization
      - slug
    TrackBrief:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          description: Unique within the owning academy, not across the platform.
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - id
      - name
      - slug
    TrackWrite:
      type: object
      description: "Creating or renaming one academy's track.\n\n``organization``\
        \ is absent by design, not omitted for brevity: the academy is\nthe view's\
        \ verified route context, so there is no field for a caller to point\nat a\
        \ tenant they do not administer. Nor is it editable afterwards \u2014\n``Track.clean()``\
        \ refuses to move a track between academies, because that\nwould carry its\
        \ levels, placements and teacher assignments with it.\n\nSlug collisions are\
        \ reported on the ``slug`` field rather than left to the\ndatabase, and the\
        \ check is scoped: ``tajweed`` may be taken *here* and free\neverywhere else.\
        \ The model's ``(organization, slug)`` constraint is still the\nbackstop."
      properties:
        name:
          type: string
          maxLength: 80
        slug:
          type: string
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - name
      - slug
    User:
      type: object
      description: The requesting user's own profile.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        timezone:
          type: string
          description: IANA zone name, e.g. 'Africa/Lagos'. Required at signup.
          maxLength: 64
        date_of_birth:
          type: string
          format: date
          nullable: true
        is_minor:
          type: boolean
          readOnly: true
          description: "Snapshot computed from date_of_birth at signup. Not recomputed\
            \ on birthdays \u2014 see learnings.md."
        is_fully_active:
          type: boolean
          readOnly: true
        signup_code:
          type: string
          readOnly: true
          description: Opaque code a student shares with a parent so the parent can
            link to them. Generated automatically at signup.
        teacher_profile:
          allOf:
          - $ref: '#/components/schemas/TeacherProfile'
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
        date_joined_local:
          type: string
          description: date_joined rendered in the user's own timezone (stored as
            UTC).
          readOnly: true
      required:
      - date_joined
      - date_joined_local
      - id
      - is_fully_active
      - is_minor
      - role
      - signup_code
      - teacher_profile
      - timezone
      - username
    WaitlistEntry:
      type: object
      description: "Read representation of one waitlist entry, for whatever side is\
        \ looking.\n\n``requested_end_utc`` is derived from the start and duration\
        \ \u2014 convenience,\nnot another stored value. ``fulfilled_booking`` is\
        \ published as the booking\nid when set; the full booking payload is not,\
        \ because the interested party\n(the lead, the family) can read the session\
        \ itself through the booking\nendpoint."
      properties:
        id:
          type: integer
          readOnly: true
        student:
          allOf:
          - $ref: '#/components/schemas/WaitlistParty'
          readOnly: true
        requested_teacher:
          allOf:
          - $ref: '#/components/schemas/WaitlistParty'
          readOnly: true
        level:
          allOf:
          - $ref: '#/components/schemas/Level'
          readOnly: true
        track:
          type: string
          description: Unique within the owning academy, not across the platform.
          readOnly: true
        requested_start_utc:
          type: string
          format: date-time
          readOnly: true
          description: "The slot the family asked for, stored UTC. Not in the spec's\
            \ field list \u2014 added with explicit approval so a promotion knows\
            \ what time to offer."
        requested_end_utc:
          type: string
          format: date-time
          readOnly: true
        requested_start_local:
          type: string
          nullable: true
          description: The slot asked for, in the requesting user's zone.
          readOnly: true
        requested_duration_minutes:
          type: integer
          readOnly: true
          description: Length of the session asked for. Added alongside the start.
        requested_at:
          type: string
          format: date-time
          readOnly: true
        requested_at_local:
          type: string
          nullable: true
          description: requested_at (stored UTC) in the requester's own zone.
          readOnly: true
        priority:
          type: integer
          readOnly: true
          description: "Set by hand, never computed. The product owner's call (2026-08-25)\
            \ on this phase's open question was that a premium_direct pricing agreement\
            \ does *not* buy queue position, so nothing in the code writes this field\
            \ \u2014 a lead raises it deliberately or not at all."
        notified:
          type: boolean
          readOnly: true
          description: 'Whether the family has been told a slot opened. Nothing in
            this phase sets it: automatic notification is explicitly out of scope
            (see tech-debt.md), so it is here for the phase that delivers it.'
        fulfilled_booking:
          type: integer
          readOnly: true
          nullable: true
          description: Set when this entry is promoted into a real session. The entry
            then stays as a record rather than being deleted.
        status:
          type: string
          description: "``open`` or ``fulfilled`` \u2014 the one thing a parent asks\
            \ for."
          readOnly: true
      required:
      - fulfilled_booking
      - id
      - level
      - notified
      - priority
      - requested_at
      - requested_at_local
      - requested_duration_minutes
      - requested_end_utc
      - requested_start_local
      - requested_start_utc
      - requested_teacher
      - status
      - student
      - track
    WaitlistParty:
