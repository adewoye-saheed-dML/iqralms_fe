openapi: 3.0.3
info:
  title: Quran Academy API
  version: 0.6.0
  description: "Identity layer: users, roles, parent links, teacher profiles. Curriculum:\
    \ tracks, levels, placement review. Scheduling: teacher availability, direct booking,\
    \ Jitsi video. Routing: cohorts, capacity-based auto-assignment. Pricing: negotiated\
    \ rates per student and level, lead-approved. Waitlist: preferred-teacher requests\
    \ when that teacher is full. Assessment: per-session rubric scoring, lead review,\
    \ family progress. Payouts: teacher payout records and period statements, lead-generated.\
    \ Organizations: the multi-tenant foundation \u2014 academies and the memberships\
    \ that grant access to one."
paths:
  /api/accounts/me/:
    get:
      operationId: accounts_me_retrieve
      description: "GET /api/accounts/me/ \u2014 the logged-in user's own profile."
      tags:
      - accounts
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/accounts/my-children/:
    get:
      operationId: accounts_my_children_list
      description: "GET /api/accounts/my-children/ \u2014 students linked to the calling\
        \ parent."
      tags:
      - accounts
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LinkedStudent'
          description: ''
  /api/accounts/organizations/{organization_pk}/children/:
    get:
      operationId: accounts_organizations_children_list
      description: "GET /api/accounts/organizations/{id}/children/ \u2014 the caller's\
        \ children *here*.\n\nThe endpoint SaaS Phase 2 exists for. ``/my-children/``\
        \ answers \"who are this\nparent's children\", globally and correctly; this\
        \ one answers \"which of them is a\nstudent of *this* academy\", and the difference\
        \ between the two answers is the\ntenant boundary.\n\nBoth sides must be active\
        \ members: a parent whose own membership is suspended\ngets an empty list,\
        \ and a linked child the academy has not admitted (or has\nsuspended) is absent\
        \ from it. So a real, global parent-child relationship cannot\nbe used to\
        \ make Academy A show a student who belongs to Academy B \u2014\n``tenancy.children_in_organization()``\
        \ is the one place that rule lives.\n\nA non-member is refused by ``IsOrganizationMember``\
        \ before the queryset runs,\nand a caller who is not a parent account gets\
        \ the same 403\n``/my-children/`` gives them. The fields are the same global\
        \ ones too: no\nsignup code, and nothing the academy owns."
      parameters:
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - accounts
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LinkedStudent'
          description: The caller's linked children who are active members of this
            organization. Empty when none are.
        '401':
          description: Not authenticated.
        '403':
          description: Not an active member of this organization, or not a parent
            account.
  /api/accounts/organizations/{organization_pk}/teacher-configurations/:
    get:
      operationId: accounts_organizations_teacher_configurations_list
      description: "/api/accounts/organizations/{id}/teacher-configurations/ \u2014\
        \ owner/admin only.\n\nGET lists this academy's teaching terms; POST gives\
        \ an existing member theirs.\nStaff and teacher members are refused both,\
        \ the same narrower default the\nmembership directory takes \u2014 what an\
        \ academy pays its teachers is not something\nan ordinary member reads, and\
        \ a narrow rule can be widened safely later.\n\nPOST names a ``user``, and\
        \ the membership is resolved inside this academy, so\nthe request cannot reach\
        \ a membership it does not administer. Only a ``lead`` or\n``sub`` account\
        \ may be given teaching terms: an organization role is authority,\nnot a teaching\
        \ identity, and Phase 2 preserves the account domain's rule about\nwho can\
        \ teach."
      parameters:
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - accounts
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationTeacherConfiguration'
          description: ''
        '401':
          description: Not authenticated.
        '403':
          description: Not an owner or administrator here.
    post:
      operationId: accounts_organizations_teacher_configurations_create
      description: "/api/accounts/organizations/{id}/teacher-configurations/ \u2014\
        \ owner/admin only.\n\nGET lists this academy's teaching terms; POST gives\
        \ an existing member theirs.\nStaff and teacher members are refused both,\
        \ the same narrower default the\nmembership directory takes \u2014 what an\
        \ academy pays its teachers is not something\nan ordinary member reads, and\
        \ a narrow rule can be widened safely later.\n\nPOST names a ``user``, and\
        \ the membership is resolved inside this academy, so\nthe request cannot reach\
        \ a membership it does not administer. Only a ``lead`` or\n``sub`` account\
        \ may be given teaching terms: an organization role is authority,\nnot a teaching\
        \ identity, and Phase 2 preserves the account domain's rule about\nwho can\
        \ teach."
      parameters:
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationTeacherConfigurationCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrganizationTeacherConfigurationCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrganizationTeacherConfigurationCreate'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationTeacherConfiguration'
          description: ''
        '400':
          description: Not a member of this organization, already configured here,
            or an account that cannot teach.
        '401':
          description: Not authenticated.
        '403':
          description: Not an owner or administrator here.
  /api/accounts/organizations/{organization_pk}/teacher-configurations/{id}/:
    get:
      operationId: accounts_organizations_teacher_configurations_retrieve
      description: "GET/PATCH one set of teaching terms \u2014 approve, re-cap the\
        \ week, re-rate the hour.\n\nThe endpoint that proves the phase: PATCHing\
        \ a teacher's terms here changes what\n*this* academy asks of them and nothing\
        \ about any other academy they work for,\nbecause the row being written belongs\
        \ to one membership. A configuration id from\nanother tenant is a 404 from\
        \ the scoped queryset.\n\nPUT is not offered. A whole-object replace would\
        \ have to accept ``membership``,\nwhich is not editable \u2014 terms pointing\
        \ at a different person or academy are\ndifferent terms."
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - accounts
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationTeacherConfiguration'
          description: ''
        '401':
          description: Not authenticated.
        '403':
          description: Not an owner or administrator here.
        '404':
          description: No such teaching terms in this organization.
    patch:
      operationId: accounts_organizations_teacher_configurations_partial_update
      description: "GET/PATCH one set of teaching terms \u2014 approve, re-cap the\
        \ week, re-rate the hour.\n\nThe endpoint that proves the phase: PATCHing\
        \ a teacher's terms here changes what\n*this* academy asks of them and nothing\
        \ about any other academy they work for,\nbecause the row being written belongs\
        \ to one membership. A configuration id from\nanother tenant is a 404 from\
        \ the scoped queryset.\n\nPUT is not offered. A whole-object replace would\
        \ have to accept ``membership``,\nwhich is not editable \u2014 terms pointing\
        \ at a different person or academy are\ndifferent terms."
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationTeacherConfigurationUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationTeacherConfigurationUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationTeacherConfigurationUpdate'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationTeacherConfiguration'
          description: ''
        '400':
          description: Nothing to change, or a value out of range.
        '401':
          description: Not authenticated.
        '403':
          description: Not an owner or administrator here.
        '404':
          description: No such teaching terms in this organization.
  /api/accounts/parent-links/:
    post:
      operationId: accounts_parent_links_create
      description: "POST /api/accounts/parent-links/ \u2014 parent links to a student\
        \ by code."
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParentLinkCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ParentLinkCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ParentLinkCreate'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParentLinkCreate'
          description: ''
  /api/assessment/organizations/{organization_pk}/{id}/:
    get:
      operationId: assessment_organizations_retrieve
      description: "GET /api/assessment/organizations/<organization_pk>/{id}/ \u2014\
        \ the lead opens one assessment in full.\n\nThe drill-down from the review\
        \ queue: booking, student, teacher, rubric\nsnapshot, scores, flag reason\
        \ and any review note. Lead-only, and reading it\ndoes **not** mark it reviewed\
        \ \u2014 the spec is explicit that clearing a flag is an\nexplicit action,\
        \ so the review stamp only ever comes from the POST below."
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - assessment
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadAssessment'
          description: ''
  /api/assessment/organizations/{organization_pk}/{id}/review/:
    post:
      operationId: assessment_organizations_review_create
      description: "POST /api/assessment/organizations/<organization_pk>/{id}/review/\
        \ \u2014 the lead annotates and marks reviewed.\n\nWrites three fields and\
        \ no others. The teacher's scores, summary and flag are\nuntouched, and the\
        \ model refuses to change them on an existing row, so \"review\nnever rewrites\
        \ historical teacher data\" holds even for a caller that tries."
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - assessment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadReview'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LeadReview'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LeadReview'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadAssessment'
          description: Reviewed. The assessment has left the pending queue.
        '403':
          description: Not the lead teacher.
        '404':
          description: No such assessment.
  /api/assessment/organizations/{organization_pk}/bookings/{booking_id}/:
    post:
      operationId: assessment_organizations_bookings_create
      description: "POST /api/assessment/organizations/<organization_pk>/bookings/{booking_id}/\
        \ \u2014 the teacher who taught it scores it.\n\nTwo layers keep this to the\
        \ right teacher and the right booking. The queryset\nis scoped to ``teacher=request.user``,\
        \ so another teacher's session is a **404**\nrather than a 403 \u2014 a 403\
        \ would confirm the booking exists. And\n``SessionAssessment.clean()`` re-checks\
        \ ``assessed_by == booking.teacher``\nanyway, so a future caller that skips\
        \ this view cannot get it wrong either.\n\nA booking that is scheduled, cancelled\
        \ or a no-show is a **400** carrying the\nmodel's own message: it exists and\
        \ belongs to this teacher, it is simply not a\nsession that happened. Submitting\
        \ an assessment does not mark a booking\ncompleted \u2014 that stays a separate\
        \ act."
      parameters:
      - in: path
        name: booking_id
        schema:
          type: integer
        required: true
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - assessment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionAssessmentCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SessionAssessmentCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SessionAssessmentCreate'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherAssessment'
          description: Submitted, with the rubric and criterion names snapshotted.
        '400':
          description: The booking is not completed, the track has no active rubric,
            a criterion is missing/unknown/duplicated, a score is outside 1-5, or
            this booking is already assessed.
        '403':
          description: Not a teacher account.
        '404':
          description: No such session for this teacher.
  /api/assessment/organizations/{organization_pk}/child/:
    get:
      operationId: assessment_organizations_child_list
      description: "GET /api/assessment/organizations/<organization_pk>/child/?student_id=\
        \ \u2014 a linked child's assessment history.\n\nSame family shape as ``/mine/``,\
        \ reached through the ``ParentLink`` check.\nNot in the spec's endpoint list,\
        \ but the spec's visibility table gives a parent\n\"linked-child assessments/progress\"\
        \ and progress alone would not be that."
      parameters:
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      - in: query
        name: student_id
        schema:
          type: integer
        required: true
      - in: query
        name: track_id
        schema:
          type: integer
      tags:
      - assessment
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FamilyAssessment'
          description: ''
        '403':
          description: Not a parent, or not this parent's child.
  /api/assessment/organizations/{organization_pk}/mine/:
    get:
      operationId: assessment_organizations_mine_list
      description: "GET /api/assessment/organizations/<organization_pk>/mine/ \u2014\
        \ the student's own assessment history.\n\nFamily shape: the teacher's summary,\
        \ the criterion scores and comments, and no\ninternal quality-control field\
        \ at all. Scoped to ``student=request.user``, so\nthis endpoint cannot be\
        \ pointed at anybody else."
      parameters:
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      - in: query
        name: track_id
        schema:
          type: integer
        description: Restrict to one track.
      tags:
      - assessment
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FamilyAssessment'
          description: ''
  /api/assessment/organizations/{organization_pk}/progress/child/:
    get:
      operationId: assessment_organizations_progress_child_retrieve
      description: "GET /api/assessment/organizations/<organization_pk>/progress/child/?student_id=&track_id=\
        \ \u2014 a linked child's.\n\nThe ``ParentLink`` check is the whole endpoint:\
        \ an unrelated parent asking about\nsomebody else's child is refused, and\
        \ the refusal happens before any progress is\ncomputed, not by omitting fields\
        \ from a response that was built anyway."
      parameters:
      - in: query
        name: from
        schema:
          type: string
        description: Inclusive ISO-8601 start of the period, by session date.
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      - in: query
        name: student_id
        schema:
          type: integer
        description: Which of your children.
        required: true
      - in: query
        name: to
        schema:
          type: string
        description: Exclusive ISO-8601 end of the period, by session date.
      - in: query
        name: track_id
        schema:
          type: integer
        required: true
      tags:
      - assessment
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProgress'
          description: ''
        '400':
          description: A missing or unknown parameter.
        '403':
          description: Not a parent, or not a parent of that student.
  /api/assessment/organizations/{organization_pk}/progress/mine/:
    get:
      operationId: assessment_organizations_progress_mine_retrieve
      description: "GET /api/assessment/organizations/<organization_pk>/progress/mine/?track_id=\
        \ \u2014 the student's own progress."
      parameters:
      - in: query
        name: from
        schema:
          type: string
        description: Inclusive ISO-8601 start of the period, by session date.
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      - in: query
        name: to
        schema:
          type: string
        description: Exclusive ISO-8601 end of the period, by session date.
      - in: query
        name: track_id
        schema:
          type: integer
        description: Which track's progress. Progress is per track.
        required: true
      tags:
      - assessment
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProgress'
          description: ''
        '400':
          description: track_id missing or unknown.
        '403':
          description: Not a student account.
  /api/assessment/organizations/{organization_pk}/progress/teaching/:
    get:
      operationId: assessment_organizations_progress_teaching_retrieve
      description: "GET /api/assessment/organizations/<organization_pk>/progress/teaching/?student_id=&track_id=\
        \ \u2014 an assigned student's progress.\n\nLead teacher and teacher can inspect\
        \ the progress of students they have an active teaching relationship with\
        \ (via Booking).\nOwners and admins have academy-wide access."
      parameters:
      - in: query
        name: from
        schema:
          type: string
        description: Inclusive ISO-8601 start of the period, by session date.
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      - in: query
        name: student_id
        schema:
          type: integer
        description: Which assigned student.
        required: true
      - in: query
        name: to
        schema:
          type: string
        description: Exclusive ISO-8601 end of the period, by session date.
      - in: query
        name: track_id
        schema:
          type: integer
        description: Which track's progress.
        required: true
      tags:
      - assessment
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProgress'
          description: ''
        '400':
          description: A missing or unknown parameter.
        '403':
          description: You do not have an assigned teaching relationship with this
            student.
        '404':
          description: Student not found.
  /api/assessment/organizations/{organization_pk}/reports/teachers/:
    get:
      operationId: assessment_organizations_reports_teachers_retrieve
      description: "GET /api/assessment/organizations/<organization_pk>/reports/teachers/\
        \ \u2014 lead-only quality visibility.\n\nOptionally narrowed by ``from``/``to``\
        \ and ``track_id``. Per teacher: how many\nsessions they assessed, the overall\
        \ average, the average per track, how many\nthey flagged, and how many of\
        \ those flags are still waiting on the lead.\n\nTwo things it is not. It is\
        \ **not** a leaderboard: rows come back ordered by\nusername and carry no\
        \ rank. And it does **not** invent rows \u2014 a teacher who\nassessed nothing\
        \ in the window is absent rather than present with 0.00, because\na missing\
        \ assessment is missing data and a zero next to someone's name is an\naccusation."
      parameters:
      - in: query
        name: from
        schema:
          type: string
        description: Inclusive ISO-8601 start of the period, by session date.
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      - in: query
        name: to
        schema:
          type: string
        description: Exclusive ISO-8601 end of the period, by session date.
      - in: query
        name: track_id
        schema:
          type: integer
        description: Restrict to one track.
      tags:
      - assessment
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeacherReport'
          description: ''
        '400':
          description: An unparseable period or track_id.
        '403':
          description: "Not the lead teacher \u2014 a sub-teacher has no academy-wide\
            \ view."
  /api/assessment/organizations/{organization_pk}/review/queue/:
    get:
      operationId: assessment_organizations_review_queue_list
      description: "GET /api/assessment/organizations/<organization_pk>/review/queue/\
        \ \u2014 flagged and not yet reviewed.\n\nOne definition of the queue, ``SessionAssessment.pending_lead_review()``,\
        \ so\nthe count in the teacher report and the list here cannot disagree. A\
        \ reviewed\nassessment leaves it; the flag itself stays on the record, because\
        \ that the\nteacher raised one is history."
      parameters:
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - assessment
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeadAssessment'
          description: ''
  /api/assessment/organizations/{organization_pk}/rubrics/:
    get:
      operationId: assessment_organizations_rubrics_list
      description: "/api/assessment/organizations/<organization_pk>/rubrics/ \u2014\
        \ the lead configures what teachers score against.\n\n* **GET ?track_id=**\
        \ lists rubrics, newest first, superseded ones included:\n  \"what do we score\
        \ Tajweed on, and what did we score it on before\" is one\n  question. Without\
        \ ``track_id`` it lists every track's.\n* **POST** creates a rubric with its\
        \ criteria. If the track already has an\n  active rubric, that one is superseded\
        \ rather than edited \u2014 see\n  ``AssessmentRubricCreateSerializer``.\n\
        \nLead-only on both sides. A rubric decides what every teacher in the academy\
        \ is\nmeasured on, so it is not something a sub-teacher configures for themselves."
      parameters:
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      - in: query
        name: track_id
        schema:
          type: integer
        description: Restrict to one track's rubrics.
      tags:
      - assessment
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssessmentRubric'
          description: ''
        '403':
          description: Not the lead teacher.
    post:
      operationId: assessment_organizations_rubrics_create
      description: "/api/assessment/organizations/<organization_pk>/rubrics/ \u2014\
        \ the lead configures what teachers score against.\n\n* **GET ?track_id=**\
        \ lists rubrics, newest first, superseded ones included:\n  \"what do we score\
        \ Tajweed on, and what did we score it on before\" is one\n  question. Without\
        \ ``track_id`` it lists every track's.\n* **POST** creates a rubric with its\
        \ criteria. If the track already has an\n  active rubric, that one is superseded\
        \ rather than edited \u2014 see\n  ``AssessmentRubricCreateSerializer``.\n\
        \nLead-only on both sides. A rubric decides what every teacher in the academy\
        \ is\nmeasured on, so it is not something a sub-teacher configures for themselves."
