            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Level'
          description: ''
        '401':
          description: Not authenticated.
        '403':
          description: Not an active member of this organization.
    post:
      operationId: curriculum_organizations_levels_create
      description: "/api/curriculum/organizations/{id}/levels/ \u2014 the academy's\
        \ ladders.\n\nFlat rather than nested under a track, with ``?track=<id>``\
        \ to narrow it: a\nclient rendering an academy's whole curriculum wants one\
