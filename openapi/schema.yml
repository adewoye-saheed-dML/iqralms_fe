      description: 'The lead annotates an assessment and marks it reviewed.


        A note and nothing else is writable, which is the whole point: review is an

        annotation beside the teacher''s scores, never an edit of them. The model

        refuses the edit too, so this is the polite layer rather than the only one.'
      properties:
        lead_review_note:
          type: string
          maxLength: 4000
    Level:
      type: object
      description: "One rung of a track's ladder.\n\n``track`` is on the read shape\
        \ because the academy-scoped level endpoints are\nflat \u2014 a client listing\
        \ an academy's levels needs to know which track each one\nbelongs to, and\
        \ the level's academy is exactly its track's academy."
      properties:
        id:
          type: integer
          readOnly: true
        track:
          type: integer
          readOnly: true
        order:
          type: integer
          readOnly: true
          description: Sequence within the track, 1 = first. Appended, never inserted.
        name:
          type: string
          readOnly: true
        min_age:
          type: integer
          readOnly: true
          nullable: true
          description: "Informational only in this phase \u2014 not a hard gate. A\
            \ 10-year-old and a 40-year-old can both sit at Beginner Arabic."
        group_eligible:
          type: boolean
          readOnly: true
          description: Whether this level may run as a cohort. Cohorts arrive in Phase
            4; the data is captured now so routing has something to read.
      required:
      - group_eligible
      - id
      - min_age
      - name
      - order
      - track
    LevelCreate:
      type: object
      description: "Appending a level to one of this academy's tracks.\n\n``order``\
        \ is deliberately not accepted. The Phase 2 rule is that levels are\nappended\
        \ and never inserted, and a server that computes the next order cannot\nbe\
        \ argued with \u2014 there is no request that expresses \"insert at 2\", so\
        \ the rule\nholds without having to reject anything. ``Level.next_order_for()``\
        \ is the same\nfunction the model validates against, so the two cannot disagree.\n\
        \n``track`` resolves inside this academy only, which is what rejects the phase\n\
        spec's named attack: Academy A's route plus Academy B's track id."
      properties:
        track:
          type: integer
        name:
          type: string
          maxLength: 80
        min_age:
          type: integer
          minimum: 1
          nullable: true
          description: "Informational only \u2014 not a hard gate on who may sit the\
            \ level."
        group_eligible:
          type: boolean
          default: false
      required:
      - name
      - track
