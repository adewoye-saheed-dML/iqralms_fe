    BookingCreate:
      type: object
      description: "A student books themselves, or a parent books a linked child.\n\
        \nEverything about *whether* the slot is legal \u2014 declared hours, overlap,\
        \ an\napproved teacher, the track specialty, the weekly cap \u2014 belongs\
        \ to\n``Booking.clean()`` and is surfaced from there, so the API and a direct\
        \ ORM\nwrite cannot disagree. This serializer only resolves who the session\
        \ is for.\n\n``routed_reason`` is not a client field: naming your own teacher\
        \ *is*\n``student_choice``, which the model already defaults to. Phase 4's\
        \ other\nthree reasons are the routing engine's to record."
