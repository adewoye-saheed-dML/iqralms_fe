  /api/curriculum/organizations/{organization_pk}/placements/:
    post:
      operationId: curriculum_organizations_placements_create
      description: "POST .../placements/ \u2014 a student of this academy submits\
        \ audio or a skip.\n\nTwo gates, both required. ``IsStudent`` is the account\
        \ role, unchanged from\nPhase 2; ``IsOrganizationMember`` is the tenant, and\
        \ it is what stops a student\nenrolled at Academy A from submitting into Academy\
        \ B by knowing its id. The\ntrack then resolves inside this academy only,\
        \ and ``PlacementResult.clean()``\nre-checks the membership at the model layer,\
        \ so the admin and a direct ORM\nwrite are held to the same rule.\n\nRe-submitting\
        \ for a track the student already has a placement for updates that\nrow back\
        \ to pending; it never creates a second one. A minor with no parent link\n\
        yet may still submit \u2014 placement is a pre-enrolment step, and\n``is_fully_active``\
        \ gates booking, not this."
      parameters:
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - curriculum
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlacementSubmit'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PlacementSubmit'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PlacementSubmit'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacementResult'
          description: Created or updated. A beginner skip comes back already 'reviewed'
            with the track's first level and no reviewer.
        '400':
          description: No such track in this academy, both audio and skip, neither
            of them, or a rejected upload.
        '401':
          description: Not authenticated.
        '403':
          description: Not an active member, or not a student account.
  /api/curriculum/organizations/{organization_pk}/placements/{id}/audio-url/:
    get:
      operationId: curriculum_organizations_placements_audio_url_retrieve
      description: "GET .../placements/{id}/audio-url/ \u2014 temporary access to\
        \ a sample.\n\nPhase 6's authorisation step, with the academy check in front\
        \ of it. Minting\nthe URL *is* the authorisation, so the whole question of\
        \ who may hear a\nrecitation sample is decided here, and SaaS Phase 3 answers\
        \ it with a\nconjunction:\n\n.. code-block:: text\n\n    authenticated\n \
        \       + active member of this academy\n        + placement belongs to this\
        \ academy\n        + Phase 6's rule: the lead teacher, or the student themselves\n\
        \nNothing was widened. Sub-teachers and parents are still refused \u2014 a\
        \ minor's\nvoice recording is the last thing a tenancy phase should open up\
        \ \u2014 and the\nroles are exactly Phase 6's.\n\nEverything unauthorised\
        \ is a 404 rather than a 403, because the queryset is\nwhat narrows it: another\
        \ academy's placement, another student's placement and a\nbeginner skip with\
        \ no recording all answer the same way, and none of them\nconfirms that a\
        \ row exists."
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - curriculum
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacementAudioAccess'
          description: A short-lived URL for the recitation sample. It expires; ask
            again rather than storing it.
        '401':
          description: Not authenticated.
        '403':
          description: Not an active member of this academy, or neither the lead teacher
            nor a student.
        '404':
          description: No such placement in this academy, not this student's placement,
            or a beginner skip with no recording.
  /api/curriculum/organizations/{organization_pk}/placements/{id}/review/:
    post:
      operationId: curriculum_organizations_placements_review_create
      description: "POST .../placements/{id}/review/ \u2014 this academy's lead sets\
        \ the level.\n\n``Lead A + Placement A`` is allowed and ``Lead A + Placement\
        \ B`` is a 404, from\nthe scoped queryset rather than from a permission class\
        \ \u2014 the placement is not\nin this academy's queryset, so the response\
        \ cannot confirm it exists. The\nmodel refuses the same thing again in ``clean()``:\
        \ a reviewer must be an active\nmember of the academy that owns the track.\n\
        \nReview is still a one-way transition: an already-reviewed placement returns\n\
        409. Correcting a level means the admin, or the student re-submitting."
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
