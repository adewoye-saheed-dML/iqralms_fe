      operationId: scheduling_organizations_route_create
      description: "POST /api/scheduling/organizations/{id}/route/ \u2014 the system\
        \ picks who teaches.\n\nCohort first, then the lead teacher if they have capacity,\
        \ then a matched\nsub-teacher. The algorithm itself is in ``routing.py``;\
        \ this view only\ntranslates its two outcomes into HTTP.\n\nA refusal is a\
        \ **409**, not a 200 with ``routed: false`` and not a 400. The\nrequest was\
        \ valid and was processed \u2014 what stands in the way is the state of\n\
        the academy's capacity, which is precisely what 409 means, and it is the code\n\
        Phase 3's cancel endpoint already uses for \"valid request, wrong state\"\
        . The\nbody is structured either way, so a frontend can explain the refusal\
        \ instead\nof showing a bare error, which is what the spec asks for.\n\nPhase\
        \ 5's ``preferred_teacher`` reuses that 409 rather than adding an outcome:\n\
        a waitlisted request is still \"valid request, wrong state\", and the entry\
        \ it\ncreated is reported inside the same ``considered`` payload. So a client\
        \ that\nalready renders the refusal keeps working, and one that wants to say\
        \ \"you are\non Ustadh's list\" reads one extra key."
      parameters:
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - scheduling
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RouteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RouteRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Routed'
          description: 'Assigned. ``routed_reason`` says how: cohort_assigned, lead_available,
            lead_full_routed, or student_choice when a ``preferred_teacher`` was named
            and could take it. A cohort seat''s start time is the cohort''s own, which
            may differ from the requested one.'
        '400':
          description: "The request itself is wrong: an unknown level, a parent not\
            \ naming a linked child, a slot the assigned teacher lost to a concurrent\
            \ booking, or a ``preferred_teacher`` who cannot teach this at all (unapproved,\
            \ wrong track) \u2014 a refusal no amount of waiting fixes, so no waitlist\
            \ entry is created for it."
        '403':
          description: Not an active member of this organization.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoCapacity'
          description: 'No capacity. Carries why each step declined; nobody is booked
            outside their hours or over their cap to avoid this. For a ``preferred_teacher``
            request this is also the waitlisted outcome: ``considered.waitlist`` carries
            the entry, and no other teacher has been assigned.'
  /api/scheduling/organizations/{organization_pk}/waitlist/:
    get:
      operationId: scheduling_organizations_waitlist_list
      description: "GET /api/scheduling/organizations/{id}/waitlist/ \u2014 all open\
        \ student requests across academy."
      parameters:
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      - in: query
        name: teacher_id
        schema:
          type: integer
        description: Filter by requested teacher ID.
        required: false
      tags:
      - scheduling
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WaitlistEntry'
          description: ''
  /api/scheduling/organizations/{organization_pk}/waitlist/{id}/promote/:
    post:
      operationId: scheduling_organizations_waitlist_promote_create
      description: "POST /api/scheduling/organizations/{id}/waitlist/{id}/promote/\
        \ \u2014 grant the request.\n\nOwner, admin, or lead teacher."
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - scheduling
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaitlistPromote'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WaitlistPromote'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WaitlistPromote'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: Booked. The entry keeps its original request and now carries
            ``fulfilled_booking``; it is not deleted.
        '400':
          description: "The teacher is no longer eligible for that slot \u2014 full,\
            \ outside their hours, or already booked. The entry stays open."
        '403':
          description: Not an active member of this organization.
        '409':
          description: Already fulfilled.
  /api/scheduling/organizations/{organization_pk}/waitlist/for-teacher/:
    get:
      operationId: scheduling_organizations_waitlist_for_teacher_list
      description: "GET /api/scheduling/organizations/{id}/waitlist/for-teacher/?teacher_id=\
        \ \u2014 the queue to work.\n\nOpen entries only, priority desc then longest-waiting,\
        \ which comes from\n``TeacherWaitlist.Meta.ordering`` rather than being re-stated\
        \ here \u2014 the\nendpoint and any future automatic offer must agree about\
        \ who is next.\n\nManagement-only (owner/admin/lead teacher)."
      parameters:
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      - in: query
        name: teacher_id
        schema:
          type: integer
        description: Whose waitlist to list.
        required: true
      tags:
      - scheduling
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WaitlistEntry'
          description: ''
  /api/scheduling/organizations/{organization_pk}/waitlist/mine/:
    get:
      operationId: scheduling_organizations_waitlist_mine_list
      description: "GET /api/scheduling/organizations/{id}/waitlist/mine/ \u2014 the\
        \ family's own entries and status.\n\nOpen and fulfilled both, newest-priority-first\
        \ per ``Meta.ordering``. A\nfulfilled entry stays visible because it is the\
        \ record of a request that was\nhonoured \u2014 \"you asked for Ustadh in\
        \ March and got the 4th of April\" is the\nhistory the phase exists to keep.\n\
        \nA **parent** reads their linked children's entries here as well as a student\n\
        reading their own (product owner's call, 2026-08-25). ``/route/`` is\n``IsStudentOrParent``,\
        \ so a parent is one of the two people who can *create*\nan entry \u2014 and\
        \ a requester who cannot then read their own request back is a\nhole, not\
        \ a privacy boundary. Scoped through ``ParentLink`` exactly as\n``BookingCancelView``\
        \ scopes cancellation, and for the same reason: a parent\nacts for their own\
        \ children and nobody else's.\n\nDeliberately *not* matched by ``/api/pricing/agreements/mine/``,\
        \ which stays\nstudent-only. A waitlist entry is scheduling; a negotiated\
        \ rate is money, and\nwho in a family may read one is a separate decision\
        \ (tech-debt.md)."
      parameters:
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - scheduling
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WaitlistEntry'
          description: ''
