  /api/curriculum/organizations/{organization_pk}/placements/children/:
    get:
      operationId: curriculum_organizations_placements_children_list
      description: "GET .../placements/children/ \u2014 a parent's linked children,\
        \ in this academy.\n\nThree conditions, and the phase spec is explicit that\
        \ all three must hold: the\nparent is active here, the child is active here,\
        \ and a ``ParentLink`` exists.\n``accounts.tenancy.children_in_organization()``\
        \ is where that rule lives and\nthis view calls it rather than re-deriving\
        \ it \u2014 a second copy is the one that\nwould eventually disagree, and\
        \ the disagreement would be a parent reading\nanother academy's student.\n\
        \nA ``ParentLink`` is a global family fact, not a key: the same parent sees\n\
        different children through Academy A's route and Academy B's.\n\nRead-only,\
        \ and no audio. Phase 6 decided that a recitation sample is for the\nlead\
        \ teacher and the student themselves, and SaaS Phase 3 is forbidden from\n\
        widening that \u2014 so a parent can see *that* their child submitted a sample\
        \ and\nwhere they were placed, and cannot hear it."
