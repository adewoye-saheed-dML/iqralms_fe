        '403':
          description: Not an organization owner or administrator.
  /api/payouts/organizations/{organization_pk}/mine/:
    get:
      operationId: payouts_organizations_mine_list
      description: "GET /api/payouts/organizations/<organization_pk>/mine/ \u2014\
        \ the caller's own payout records.\n\nOptionally bounded by ``?start=&end=``;\
        \ unbounded it is the teacher's whole\npayout history in this academy, which\
        \ is theirs to read. The queryset is scoped\nto ``request.user`` and ``self.organization``,\
        \ and there is no parameter that\ncould widen it \u2014 another teacher's\
        \ records are not a 403 here, they simply are\nnot in the set.\n\nGenerated\
        \ and finalized records both appear. A teacher seeing only finalized\nones\
        \ would have no way to check a draft before it becomes history."
      parameters:
      - in: query
        name: end
        schema:
          type: string
        description: Exclusive period end, ISO-8601 UTC.
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      - in: query
        name: start
        schema:
          type: string
        description: Inclusive period start, ISO-8601 UTC, e.g. 2026-08-01T00:00:00Z.
