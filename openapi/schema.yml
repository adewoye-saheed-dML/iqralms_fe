  /api/organizations/{organization_pk}/memberships/{id}/:
    patch:
      operationId: organizations_memberships_partial_update
      description: "PATCH /api/organizations/{id}/memberships/{member_id}/ \u2014\
        \ suspend, reactivate, re-role.\n\nThe three membership-management operations\
        \ the phase spec gives owner and\nadmin, behind one partial update: ``status``\
        \ suspends or reactivates,\n``role`` moves a member between ``admin``, ``staff``\
        \ and ``teacher``. The row\nis never deleted \u2014 a suspended membership\
        \ is a record that someone was here.\n\nTwo things this endpoint refuses.\
        \ The owner's membership, to anyone including\nthe owner, because demoting\
        \ or suspending it is an ownership transfer rather\nthan a role edit. And\
        \ a membership belonging to another organization, which is\na 404 from the\
        \ queryset: the URL's tenant is the only one whose rows are\nvisible here.\n\
        \nPUT is not offered. A whole-object replace would have to accept\n``organization``\
        \ and ``user``, and neither is editable \u2014 a membership pointing\nat a\
        \ different tenant or a different person is a different membership."
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - organizations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationMembershipUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationMembershipUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationMembershipUpdate'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMembership'
          description: ''
        '400':
          description: Nothing to change, or a role that is not assignable.
        '401':
          description: Not authenticated.
        '403':
          description: Not an owner or administrator here, or the target is the organization's
            owner.
        '404':
          description: No such membership in this organization.
