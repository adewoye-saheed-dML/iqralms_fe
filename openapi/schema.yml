        name: start
        schema:
          type: string
        description: Inclusive period start, ISO-8601 UTC, e.g. 2026-08-01T00:00:00Z.
      - in: query
        name: teacher_id
        schema:
          type: integer
        description: Narrow the listing to one teacher.
