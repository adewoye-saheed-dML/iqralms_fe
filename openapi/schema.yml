    FamilyPayment:
      type: object
      description: Detailed view of a family tuition payment.
      properties:
        id:
          type: integer
          readOnly: true
        student:
          type: integer
          readOnly: true
          description: Student whose tuition is being paid. Must have role 'student'.
        student_username:
          type: string
          readOnly: true
        student_name:
          type: string
          readOnly: true
        organization:
          type: integer
          readOnly: true
          description: The academy receiving this tuition directly via Paystack subaccount.
        organization_name:
          type: string
          readOnly: true
        initiated_by:
          type: integer
          readOnly: true
          description: User who initiated payment (adult student or parent; never
            a minor).
        initiated_by_username:
          type: string
          readOnly: true
        pricing_agreement:
          type: integer
          readOnly: true
          description: The PricingAgreement snapshot this payment satisfies.
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          description: Snapshotted amount in NGN at initialization. Never recomputed.
        currency:
          type: string
          readOnly: true
          description: Tuition currency, matching payouts (NGN).
        paystack_reference:
          type: string
          readOnly: true
          description: Server-generated unique reference sent to Paystack.
        status:
          allOf:
          - $ref: '#/components/schemas/FamilyPaymentStatusEnum'
          readOnly: true
          description: 'pending -> paid | failed | abandoned.


            * `pending` - Pending

            * `paid` - Paid

            * `failed` - Failed

            * `abandoned` - Abandoned'
        created_at:
          type: string
          format: date-time
          readOnly: true
        paid_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Timestamp when charge.success finalized this payment.
      required:
      - amount
      - created_at
      - currency
      - id
      - initiated_by
      - initiated_by_username
      - organization
      - organization_name
      - paid_at
      - paystack_reference
      - pricing_agreement
      - status
      - student
      - student_name
      - student_username
    FamilyPaymentStatusEnum:
      enum:
      - pending
      - paid
      - failed
      - abandoned
      type: string
      description: '* `pending` - Pending

        * `paid` - Paid

        * `failed` - Failed

        * `abandoned` - Abandoned'
    PaymentInitialize:
      type: object
      description: Payload to initiate a tuition payment.
      properties:
        pricing_agreement_id:
          type: integer
        student_id:
          type: integer
        callback_url:
          oneOf:
          - type: string
            format: uri
          - type: string
            maxLength: 0
      required:
      - pricing_agreement_id
    PaymentInitializeResponse:
      type: object
      description: Response returned upon successful payment initialization.
      properties:
        payment_id:
          type: integer
        reference:
          type: string
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        currency:
          type: string
        authorization_url:
          type: string
          format: uri
        access_code:
          type: string
      required:
      - amount
      - currency
      - payment_id
      - reference
    PlatformSubscription:
      type: object
      description: Current subscription status for an academy.
      properties:
        id:
          type: integer
          readOnly: true
        organization_id:
          type: integer
          readOnly: true
        organization_name:
          type: string
          readOnly: true
        organization_slug:
          type: string
          readOnly: true
        paystack_plan_code:
          type: string
          readOnly: true
          description: Paystack Plan code for IqraLMS platform access.
        status:
          allOf:
          - $ref: '#/components/schemas/PlatformSubscriptionStatusEnum'
          readOnly: true
          description: 'Current subscription lifecycle status.


            * `active` - Active

            * `past_due` - Past Due

            * `not_renewing` - Not Renewing

            * `disabled` - Disabled'
        current_period_end:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: End of the current paid billing period.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - current_period_end
      - id
      - organization_id
      - organization_name
      - organization_slug
      - paystack_plan_code
      - status
      - updated_at
    PlatformSubscriptionStatusEnum:
      enum:
      - active
      - past_due
      - not_renewing
      - disabled
      type: string
      description: '* `active` - Active

        * `past_due` - Past Due

        * `not_renewing` - Not Renewing

        * `disabled` - Disabled'
    SubaccountSetup:
      type: object
      description: Payload to configure an academy's settlement bank details.
      properties:
        organization_id:
          type: integer
        bank_code:
          type: string
          maxLength: 10
        account_number:
          type: string
          maxLength: 20
        business_name:
          type: string
          default: ''
      required:
      - account_number
      - bank_code
      - organization_id
    SubaccountSetupResponse:
      type: object
      description: Response after resolving and creating subaccount.
      properties:
        account_name:
          type: string
        subaccount_code:
          type: string
        bank_code:
          type: string
        account_number:
          type: string
      required:
      - account_name
      - account_number
      - bank_code
      - subaccount_code
    SubscribeRequest:
      type: object
      description: Request payload to subscribe an organization.
      properties:
        organization_id:
          type: integer
        plan_code:
          type: string
      required:
      - organization_id
    PaystackWebhookPayload:
      type: object
      description: Generic schema for Paystack webhook events.
      properties:
        event:
          type: string
        data:
          type: object
          additionalProperties: {}
      required:
      - data
      - event
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
